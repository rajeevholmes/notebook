<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://api.open-meteo.com https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'self'; object-src 'none';">

<title>Notebook</title>
<style>
  :root{
    --paper: #F7EFC6;
    --rule: #9FB9D9;
    --margin: #C0392B;
    --ink: #2A2A28;
    --ink-soft: #6b6a5f;
    --accent: #C0392B;
    --highlight: #FCE38A;
    --card-shadow: rgba(42,42,40,0.18);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--paper);
    background-image: linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--rule) 28px);
    background-size: 100% 28px;
    color: var(--ink);
    min-height: 100vh;
    position: relative;
  }
  body::before{
    content:"";
    position: fixed; top:0; bottom:0; left: 34px; width: 2px;
    background: var(--margin); opacity: 0.55; pointer-events: none; z-index: 0;
  }
  header{
    position: sticky; top:0; z-index: 5;
    background: var(--paper);
    padding: 16px 16px 10px 46px;
    border-bottom: 1px dashed rgba(42,42,40,0.3);
  }
  h1{
    margin:0 0 12px 0; font-size: 22px; letter-spacing: 1px;
    text-transform: uppercase; font-weight: 700;
    display:flex; justify-content: space-between; align-items:center; gap:8px;
  }
  h1 .dot{ color: var(--accent); }
  h1 .right{ display:flex; gap:6px; }
  h1 .smallBtn{
    font-size: 11px; letter-spacing: 0.5px; text-transform: none;
    font-weight:700; color: var(--ink-soft); background:none; border: 1px solid rgba(42,42,40,0.3);
    border-radius: 5px; padding: 6px 8px; cursor:pointer; font-family: inherit;
  }
  .syncStatus{ font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; display:flex; align-items:center; gap:6px; }
  .syncDot{ width:7px; height:7px; border-radius:50%; background:#4a9; flex-shrink:0; }
  .syncDot.offline{ background:#c0392b; }
  .weatherLine{ font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .searchWrap{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(42,42,40,0.35);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 10px;
  }
  .searchWrap input{
    border:none; background: transparent; outline:none;
    font-family: inherit; font-size: 15px; flex:1; color: var(--ink);
  }
  .searchWrap svg{ flex-shrink:0; opacity:0.6; }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom: 2px; }
  .tab{
    font-family: inherit; font-size: 12px; font-weight:700;
    border: 1px solid rgba(42,42,40,0.35); background: rgba(255,255,255,0.4);
    border-radius: 999px; padding: 6px 12px; white-space: nowrap; cursor:pointer;
    color: var(--ink-soft);
  }
  .tab.active{ background: var(--accent); border-color: var(--accent); color:#fff; }
  main{ padding: 12px 16px 100px 46px; position: relative; z-index: 1; }
  .empty{ margin-top: 60px; text-align:center; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  .note{
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(42,42,40,0.25);
    border-left: 3px solid var(--margin);
    border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer;
    box-shadow: 0 2px 0 var(--card-shadow);
    display:flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .note:active{ transform: translateY(1px); }
  .note .body{ min-width:0; flex:1; }
  .note .title{ font-weight:700; font-size:15px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .note .snippet{ font-size:13px; color: var(--ink-soft); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; margin-top: 2px; }
  .note .meta{ font-size:11px; color: var(--ink-soft); margin-top:4px; letter-spacing: 0.3px; display:flex; gap:8px; align-items:center; }
  .note .meta .tag{ background: rgba(42,42,40,0.08); border-radius: 999px; padding: 1px 8px; }
  .note mark{ background: var(--highlight); color: inherit; padding:0 1px; }
  .note .del{ border:none; background:none; color: var(--ink-soft); font-size: 18px; line-height:1; padding: 4px 6px; cursor:pointer; }
  .fab{
    position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; border:none; font-size: 28px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 6; cursor:pointer;
  }
  .editorOverlay{
    position: fixed; inset:0; background: var(--paper);
    background-image: linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--rule) 28px);
    background-size: 100% 28px; z-index: 20; display:flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.22s ease;
  }
  .editorOverlay.open{ transform: translateY(0); }
  .editorOverlay::before{ content:""; position:absolute; top:0; bottom:0; left:34px; width:2px; background: var(--margin); opacity:0.55; }
  .editorBar{
    display:flex; align-items:center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px dashed rgba(42,42,40,0.3); position: relative; z-index:1; background: var(--paper);
  }
  .editorBar button{ border:none; background:none; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--accent); padding: 6px 4px; cursor:pointer; }
  .editorBar .status{ font-size: 12px; color: var(--ink-soft); }
  .folderPicker{ display:flex; gap:6px; padding: 0 16px 10px 46px; position:relative; z-index:1; background: var(--paper); }
  .folderPicker button{
    font-family: inherit; font-size: 12px; font-weight:700;
    border: 1px solid rgba(42,42,40,0.35); background: rgba(255,255,255,0.4);
    border-radius: 999px; padding: 6px 12px; cursor:pointer; color: var(--ink-soft);
  }
  .folderPicker button.active{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .matchBar{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding: 6px 16px 8px 46px; position:relative; z-index:1; background: var(--paper);
    font-size: 12px; color: var(--ink-soft);
  }
  .matchBar button{
    font-family: inherit; font-size: 12px; font-weight:700; color: var(--accent);
    background: rgba(255,255,255,0.5); border: 1px solid rgba(42,42,40,0.3);
    border-radius: 999px; padding: 4px 10px; cursor:pointer;
  }
  textarea{
    flex:1; border:none; outline:none; resize:none; background: transparent;
    font-family: inherit; font-size: 16px; line-height: 28px; color: var(--ink);
    padding: 0 16px 24px 46px; position: relative; z-index: 1;
  }
  ::selection{ background: var(--highlight); }
  #importFile{ display:none; }
  .toast{
    position: fixed; left:50%; bottom: 90px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-size: 13px; padding: 8px 14px;
    border-radius: 6px; z-index: 30; opacity:0; pointer-events:none; transition: opacity 0.2s ease;
  }
  .toast.show{ opacity: 0.95; }

  /* Auth screen */
  .authScreen{
    position: fixed; inset:0; z-index: 50; background: var(--paper);
    display:flex; align-items:center; justify-content:center; padding: 24px;
  }
  .authBox{ width: 100%; max-width: 340px; }
  .authBox h2{ font-size: 20px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 4px 0; }
  .authBox p.sub{ color: var(--ink-soft); font-size: 13px; margin: 0 0 20px 0; }
  .authBox input{
    width:100%; font-family: inherit; font-size: 15px; padding: 12px;
    border: 1px solid rgba(42,42,40,0.35); border-radius: 6px; margin-bottom: 10px;
    background: rgba(255,255,255,0.6); outline:none;
  }
  .authBox .authBtn{
    width:100%; font-family: inherit; font-size: 15px; font-weight:700; padding: 12px;
    border:none; border-radius: 6px; background: var(--accent); color:#fff; cursor:pointer; margin-bottom: 10px;
  }
  .authBox .switchMode{
    background:none; border:none; font-family: inherit; font-size: 13px; color: var(--ink-soft);
    text-decoration: underline; cursor:pointer; padding:0; display:block; margin: 0 auto;
  }
  .authBox .authError{ color: var(--accent); font-size: 13px; margin-bottom: 10px; min-height: 16px; }
  .hidden{ display:none !important; }

  /* Gemini chat */
  .chatFab{
    position: fixed; left: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
    background: #2A2A28; color: #FCE38A; border:none; font-size: 24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 6; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .chatOverlay{
    position: fixed; inset:0; background: var(--paper);
    background-image: linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--rule) 28px);
    background-size: 100% 28px; z-index: 25; display:flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.22s ease;
  }
  .chatOverlay.open{ transform: translateY(0); }
  .chatOverlay::before{ content:""; position:absolute; top:0; bottom:0; left:34px; width:2px; background: var(--margin); opacity:0.55; }
  .chatBar{
    display:flex; align-items:center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px dashed rgba(42,42,40,0.3); position: relative; z-index:1; background: var(--paper);
  }
  .chatBar button{ border:none; background:none; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--accent); padding: 6px 4px; cursor:pointer; }
  .chatBar .title{ font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:14px; }
  .chatMessages{ flex:1; overflow-y:auto; padding: 12px 16px 12px 46px; position:relative; z-index:1; }
  .chatMsg{ margin-bottom: 14px; max-width: 90%; }
  .chatMsg.user{ margin-left: auto; text-align:right; }
  .chatMsg .bubble{
    display:inline-block; padding: 8px 12px; border-radius: 8px; font-size: 15px; line-height:22px;
    text-align:left; white-space: pre-wrap;
  }
  .chatMsg.user .bubble{ background: var(--accent); color:#fff; }
  .chatMsg.model .bubble{ background: rgba(255,255,255,0.6); border: 1px solid rgba(42,42,40,0.2); }
  .chatMsg .who{ font-size:11px; color: var(--ink-soft); margin-bottom:3px; }
  .chatInputBar{
    display:flex; gap:8px; padding: 10px 16px 16px 46px; position:relative; z-index:1;
    background: var(--paper); border-top: 1px dashed rgba(42,42,40,0.3);
  }
  .chatInputBar textarea{
    flex:1; font-family: inherit; font-size: 15px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(42,42,40,0.35); background: rgba(255,255,255,0.6); resize:none;
    min-height: 44px; max-height: 120px; outline:none;
  }
  .chatInputBar button{
    font-family: inherit; font-weight:700; font-size: 14px; padding: 0 16px; border:none;
    border-radius: 8px; background: var(--accent); color:#fff; cursor:pointer;
  }
  .chatInputBar button:disabled{ opacity:0.5; }
  .chatTyping{ font-size:12px; color: var(--ink-soft); padding: 0 16px 8px 46px; }
</style>
</head>
<body>

<div class="authScreen" id="authScreen">
  <div class="authBox">
    <h2>Notebook<span style="color:var(--accent)">.</span></h2>
    <p class="sub" id="authSub">Sign in to sync your notes across devices.</p>
    <div class="authError" id="authError"></div>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
    <button class="authBtn" id="authSubmit">Sign in</button>
    <button class="switchMode" id="authSwitch">New here? Create an account</button>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header>
    <h1>Notebook<span class="dot">.</span>
      <span class="right">
        <button class="smallBtn" id="backupBtn">Backup</button>
        <button class="smallBtn" id="signOutBtn">Sign out</button>
      </span>
    </h1>
    <div class="syncStatus"><span class="syncDot" id="syncDot"></span><span id="syncText">Synced</span></div>
    <div class="weatherLine" id="weatherLine">Loading weather…</div>
    <div class="searchWrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search notes…" autocomplete="off" />
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <main id="list"></main>

  <button class="fab" id="newBtn" aria-label="New note">+</button>
  <button class="chatFab" id="chatFabBtn" aria-label="Open chat">💬</button>

  <div class="chatOverlay" id="chatOverlay">
    <div class="chatBar">
      <button id="chatBackBtn">‹ Back</button>
      <span class="title">Chat</span>
      <span>
        <button id="chatKeyBtn">Key</button>
        <button id="chatClearBtn">Clear</button>
      </span>
    </div>
    <div class="chatMessages" id="chatMessages">
      <div class="chatMsg model"><div class="who">Gemini</div><div class="bubble">Hi — ask me anything.</div></div>
    </div>
    <div class="chatTyping hidden" id="chatTyping">Thinking…</div>
    <div class="chatInputBar">
      <textarea id="chatInput" placeholder="Type a message…" rows="1"></textarea>
      <button id="chatSendBtn">Send</button>
    </div>
  </div>

  <div class="editorOverlay" id="editor">
    <div class="editorBar">
      <button id="backBtn">‹ Back</button>
      <span class="status" id="status"></span>
      <button id="deleteBtn">Delete</button>
    </div>
    <div class="folderPicker" id="folderPicker"></div>
    <div class="matchBar hidden" id="matchBar">
      <button id="prevMatch">‹ Prev</button>
      <span id="matchCount"></span>
      <button id="nextMatch">Next ›</button>
    </div>
    <textarea id="textarea" placeholder="Start writing…"></textarea>
  </div>

  <input type="file" id="importFile" accept="application/json">
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, addDoc,
  serverTimestamp, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCciYKqJAUlgTh2-8I4UsbvtEeXVlPoFIo",
  authDomain: "notes-android-a227b.firebaseapp.com",
  projectId: "notes-android-a227b",
  storageBucket: "notes-android-a227b.firebasestorage.app",
  messagingSenderId: "798177259852",
  appId: "1:798177259852:web:f07275d6376ee438cddfe9"
};

// No API key is hardcoded here on purpose: a key committed to a public repo
// gets scraped and disabled within minutes. Each browser stores its own key
// locally (never sent anywhere but Google's API and never committed to git).
const GEMINI_MODEL = "gemini-2.5-flash";
function getGeminiKey(){ return localStorage.getItem('geminiApiKey') || ''; }

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

// ---------- Weather API demo ----------
// This is the whole pattern every API call follows: build a URL, fetch it,
// read the JSON that comes back, pull out the bits you want, show them.

// Open-Meteo's "weather codes" are numbers standing in for conditions.
// The API doesn't send English words, so we translate the number ourselves.
const WEATHER_CODES = {
  0: '☀️ Clear', 1: '🌤️ Mostly clear', 2: '⛅ Partly cloudy', 3: '☁️ Overcast',
  45: '🌫️ Fog', 48: '🌫️ Fog', 51: '🌦️ Light drizzle', 53: '🌦️ Drizzle', 55: '🌧️ Heavy drizzle',
  61: '🌧️ Light rain', 63: '🌧️ Rain', 65: '🌧️ Heavy rain', 71: '🌨️ Light snow', 73: '🌨️ Snow',
  75: '❄️ Heavy snow', 80: '🌦️ Showers', 81: '🌦️ Showers', 82: '⛈️ Violent showers',
  95: '⛈️ Thunderstorm'
};

async function loadWeather(){
  const el = document.getElementById('weatherLine');
  // 1. Build the request URL. Coordinates are hardcoded here for London.
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=51.5074&longitude=-0.1278&current_weather=true';
  try {
    // 2. Send the request and wait for the response.
    const response = await fetch(url);
    // 3. The response body is JSON text — .json() turns it into a JS object.
    const data = await response.json();
    // 4. Pull out just the fields we care about.
    const temp = Math.round(data.current_weather.temperature);
    const code = data.current_weather.weathercode;
    const desc = WEATHER_CODES[code] || 'Weather';
    // 5. Write it onto the page.
    el.textContent = desc + ' · ' + temp + '°C in London';
  } catch (err) {
    // If there's no internet, or the API is down, fail quietly rather than breaking the app.
    el.textContent = '';
  }
}
loadWeather();
let uid = null;
let notes = [];
let folders = { f1: 'Folder 1', f2: 'Folder 2' };
let activeId = null;
let activeTab = 'all';
let saveTimer = null;
let currentMatches = [];
let currentMatchPos = 0;
let currentMatchLen = 0;
let unsubNotes = null;
let unsubFolders = null;
let authMode = 'signin';

function escapeHtml(s){
  return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function firstLine(text){ var t = (text || '').split('\n')[0].trim(); return t || 'Untitled note'; }
function snippet(text){ var lines = (text || '').split('\n').slice(1).join(' ').trim(); return lines.slice(0, 90); }
// Returns up to 4 individual lines (after the title line) that contain the query,
// each on its own row, capped in length. Falls back to a plain snippet when there's no query.
function matchingLines(text, q){
  var lines = (text || '').split('\n');
  if(!q){
    var plain = snippet(text);
    return plain ? [plain] : [];
  }
  var ql = q.toLowerCase();
  var hits = [];
  for(var i = 1; i < lines.length && hits.length < 6; i++){
    var trimmed = lines[i].trim();
    if(trimmed && trimmed.toLowerCase().indexOf(ql) !== -1){
      hits.push(trimmed.length > 140 ? trimmed.slice(0, 140) + '…' : trimmed);
    }
  }
  // also check the title line for a match so a hit there doesn't leave the list empty
  if(hits.length === 0 && lines[0] && lines[0].toLowerCase().indexOf(ql) === -1){
    // title didn't match and no body line matched via this path — nothing to add
  }
  return hits;
}
function firstMatchIndex(text, q){
  if(!q) return -1;
  return (text || '').toLowerCase().indexOf(q.toLowerCase());
}
// Returns the start index of every occurrence of q within text (case-insensitive).
function allMatchIndices(text, q){
  var out = [];
  if(!q) return out;
  var hay = (text || '').toLowerCase();
  var needle = q.toLowerCase();
  var from = 0, idx;
  while((idx = hay.indexOf(needle, from)) !== -1){
    out.push(idx);
    from = idx + needle.length;
  }
  return out;
}
function fmtDate(ts){
  if(!ts) return '';
  var d = new Date(ts); var now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  var opts = sameDay ? {hour:'2-digit', minute:'2-digit'} : {day:'numeric', month:'short'};
  return d.toLocaleString(undefined, opts);
}
function highlight(text, q){
  var esc = escapeHtml(text);
  if(!q) return esc;
  var escQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc.replace(new RegExp('(' + escQ + ')', 'ig'), '<mark>$1</mark>');
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// ---------- Auth screen wiring ----------
const authScreen = document.getElementById('authScreen');
const appRoot = document.getElementById('appRoot');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authError = document.getElementById('authError');
const authSub = document.getElementById('authSub');
const authSubmit = document.getElementById('authSubmit');
const authSwitch = document.getElementById('authSwitch');

authSwitch.addEventListener('click', function(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  authError.textContent = '';
  if(authMode === 'signup'){
    authSub.textContent = 'Create an account to start syncing.';
    authSubmit.textContent = 'Create account';
    authSwitch.textContent = 'Already have an account? Sign in';
  } else {
    authSub.textContent = 'Sign in to sync your notes across devices.';
    authSubmit.textContent = 'Sign in';
    authSwitch.textContent = "New here? Create an account";
  }
});

authSubmit.addEventListener('click', function(){
  var email = authEmail.value.trim();
  var pw = authPassword.value;
  authError.textContent = '';
  if(!email || !pw){ authError.textContent = 'Enter an email and password.'; return; }
  var action = authMode === 'signup' ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
  action(auth, email, pw).catch(function(err){
    authError.textContent = friendlyAuthError(err.code);
  });
});

function friendlyAuthError(code){
  var map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-not-found': 'No account with that email — try "Create an account".',
    'auth/wrong-password': 'Wrong password.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/email-already-in-use': 'An account already exists — try signing in instead.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/network-request-failed': 'No internet connection right now.'
  };
  return map[code] || 'Something went wrong. Try again.';
}

document.getElementById('signOutBtn').addEventListener('click', function(){
  signOut(auth);
});

onAuthStateChanged(auth, function(user){
  if(user){
    uid = user.uid;
    authScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
    subscribeToData();
  } else {
    uid = null;
    if(unsubNotes) unsubNotes();
    if(unsubFolders) unsubFolders();
    appRoot.classList.add('hidden');
    authScreen.classList.remove('hidden');
  }
});

// ---------- Online/offline indicator ----------
function updateSyncStatus(){
  var dot = document.getElementById('syncDot');
  var text = document.getElementById('syncText');
  if(navigator.onLine){ dot.classList.remove('offline'); text.textContent = 'Synced'; }
  else { dot.classList.add('offline'); text.textContent = 'Offline — will sync when back online'; }
}
window.addEventListener('online', updateSyncStatus);
window.addEventListener('offline', updateSyncStatus);

// ---------- Firestore data ----------
function notesCol(){ return collection(db, 'users', uid, 'notes'); }
function foldersDoc(){ return doc(db, 'users', uid, 'meta', 'folders'); }

function subscribeToData(){
  updateSyncStatus();
  unsubNotes = onSnapshot(notesCol(), function(snap){
    notes = snap.docs.map(function(d){
      var data = d.data();
      return { id: d.id, text: data.text || '', folder: data.folder || null, updatedAt: data.updatedAt || 0 };
    });
    renderTabs(); render();
    if(activeId){
      var current = notes.find(function(n){ return n.id === activeId; });
      if(current) renderFolderPicker(current);
    }
  }, function(){ updateSyncStatus(); });

  unsubFolders = onSnapshot(foldersDoc(), function(snap){
    if(snap.exists()) folders = Object.assign({f1:'Folder 1', f2:'Folder 2'}, snap.data());
    renderTabs();
  }, function(){});
}

function renderTabs(){
  var tabs = document.getElementById('tabs');
  var defs = [
    {id:'all', label:'All'},
    {id:'f1', label: folders.f1},
    {id:'f2', label: folders.f2},
    {id:'none', label:'Unfiled'}
  ];
  tabs.innerHTML = defs.map(function(t){
    return '<button class="tab' + (activeTab===t.id?' active':'') + '" data-tab="' + t.id + '">' + escapeHtml(t.label) + '</button>';
  }).join('');
}

function render(){
  var q = document.getElementById('search').value.trim();
  var list = document.getElementById('list');
  var filtered = notes
    .filter(function(n){ return !q || (n.text || '').toLowerCase().indexOf(q.toLowerCase()) !== -1; })
    .filter(function(n){
      if(activeTab === 'all') return true;
      if(activeTab === 'none') return !n.folder;
      return n.folder === activeTab;
    })
    .sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">' + (q
      ? 'No notes match "' + escapeHtml(q) + '".'
      : 'No notes here yet.<br>Tap + to write one.') + '</div>';
    return;
  }

  list.innerHTML = filtered.map(function(n){
    var title = highlight(firstLine(n.text), q);
    var lines = matchingLines(n.text, q);
    var snipHtml = lines.map(function(l){ return '<div class="snippet">' + highlight(l, q) + '</div>'; }).join('');
    var tagLabel = n.folder ? folders[n.folder] : null;
    var safeId = escapeHtml(n.id);
    return '' +
      '<div class="note" data-id="' + safeId + '" data-query="' + escapeHtml(q) + '">' +
        '<div class="body">' +
          '<div class="title">' + title + '</div>' +
          snipHtml +
          '<div class="meta"><span>' + fmtDate(n.updatedAt) + '</span>' + (tagLabel ? '<span class="tag">' + escapeHtml(tagLabel) + '</span>' : '') + '</div>' +
        '</div>' +
        '<button class="del" data-id="' + safeId + '" aria-label="Delete note">×</button>' +
      '</div>';
  }).join('');
}

function renderFolderPicker(note){
  var wrap = document.getElementById('folderPicker');
  var opts = [{id:null,label:'None'},{id:'f1',label:folders.f1},{id:'f2',label:folders.f2}];
  wrap.innerHTML = opts.map(function(o){
    var active = (note.folder || null) === o.id;
    return '<button data-folder="' + (o.id||'') + '" class="' + (active?'active':'') + '">' + escapeHtml(o.label) + '</button>';
  }).join('');
}

function gotoMatch(pos){
  var ta = document.getElementById('textarea');
  if(currentMatches.length === 0) return;
  currentMatchPos = ((pos % currentMatches.length) + currentMatches.length) % currentMatches.length;
  var idx = currentMatches[currentMatchPos];
  ta.focus();
  ta.setSelectionRange(idx, idx + currentMatchLen);
  var upTo = ta.value.slice(0, idx);
  var lineNum = upTo.split('\n').length - 1;
  var lineHeight = 28;
  ta.scrollTop = Math.max(0, lineNum * lineHeight - 80);
  document.getElementById('matchCount').textContent = (currentMatchPos + 1) + ' of ' + currentMatches.length;
}

function openEditor(id, jumpQuery){
  activeId = id;
  var note = notes.find(function(n){ return n.id === id; });
  var ta = document.getElementById('textarea');
  ta.value = note ? note.text : '';
  document.getElementById('status').textContent = '';
  renderFolderPicker(note || {folder:null});
  document.getElementById('editor').classList.add('open');

  var matchBar = document.getElementById('matchBar');
  if(jumpQuery && note){
    currentMatches = allMatchIndices(note.text, jumpQuery);
    currentMatchLen = jumpQuery.length;
    currentMatchPos = 0;
    if(currentMatches.length > 0){
      matchBar.classList.remove('hidden');
      setTimeout(function(){ gotoMatch(0); }, 200);
    } else {
      matchBar.classList.add('hidden');
      setTimeout(function(){ ta.focus(); }, 200);
    }
  } else {
    currentMatches = [];
    matchBar.classList.add('hidden');
    setTimeout(function(){ ta.focus(); ta.setSelectionRange(0,0); }, 200);
  }
}
function closeEditor(){
  document.getElementById('editor').classList.remove('open');
  document.getElementById('matchBar').classList.add('hidden');
  currentMatches = [];
  activeId = null;
  render();
}

async function newNote(){
  var folder = (activeTab === 'f1' || activeTab === 'f2') ? activeTab : null;
  var ref = await addDoc(notesCol(), { text: '', folder: folder, updatedAt: Date.now() });
  openEditor(ref.id);
}

function scheduleSave(){
  var status = document.getElementById('status');
  status.textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async function(){
    if(!activeId) return;
    var text = document.getElementById('textarea').value;
    var now = Date.now();
    await updateDoc(doc(db, 'users', uid, 'notes', activeId), { text: text, updatedAt: now });
    status.textContent = 'Saved ' + fmtDate(now);
  }, 400);
}

async function deleteActive(){
  if(!activeId) return;
  await deleteDoc(doc(db, 'users', uid, 'notes', activeId));
  closeEditor();
}

async function flushAndMaybeDeleteEmpty(){
  if(!activeId) return;
  var text = document.getElementById('textarea').value;
  if(text.trim() === ''){
    await deleteDoc(doc(db, 'users', uid, 'notes', activeId)).catch(function(){});
  } else {
    await updateDoc(doc(db, 'users', uid, 'notes', activeId), { text: text, updatedAt: Date.now() }).catch(function(){});
  }
}

function exportBackup(){
  var data = { notes: notes, folders: folders, exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'notebook-backup-' + stamp + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup file downloaded');
}

// Firestore caps a single batch at 500 writes; chunk comfortably under that.
var BATCH_LIMIT = 450;
async function commitInChunks(db, refsAndOps){
  for(var i = 0; i < refsAndOps.length; i += BATCH_LIMIT){
    var chunk = refsAndOps.slice(i, i + BATCH_LIMIT);
    var b = writeBatch(db);
    chunk.forEach(function(op){ op(b); });
    await b.commit();
  }
}

// Only accept a plain string, trimmed and length-capped, from untrusted backup data.
function cleanString(v, maxLen){
  return (typeof v === 'string' ? v : '').slice(0, maxLen || 200000);
}
function cleanFolder(v){
  return (v === 'f1' || v === 'f2') ? v : null;
}
function cleanTimestamp(v){
  return (typeof v === 'number' && isFinite(v)) ? v : Date.now();
}

async function importBackup(file){
  var reader = new FileReader();
  reader.onload = async function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.notes)) throw new Error('bad file');
      if(!confirm('Replace all current notes with this backup? This cannot be undone.')) return;

      var existing = await getDocs(notesCol());
      await commitInChunks(db, existing.docs.map(function(d){
        return function(b){ b.delete(d.ref); };
      }));

      await commitInChunks(db, data.notes.map(function(n){
        var ref = doc(notesCol());
        var clean = {
          text: cleanString(n && n.text, 200000),
          folder: cleanFolder(n && n.folder),
          updatedAt: cleanTimestamp(n && n.updatedAt)
        };
        return function(b){ b.set(ref, clean); };
      }));

      if(data.folders && typeof data.folders === 'object'){
        await setDoc(foldersDoc(), {
          f1: cleanString(data.folders.f1, 60) || 'Folder 1',
          f2: cleanString(data.folders.f2, 60) || 'Folder 2'
        });
      }
      toast('Backup restored');
    }catch(e){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
}

document.getElementById('newBtn').addEventListener('click', newNote);
document.getElementById('backBtn').addEventListener('click', async function(){
  await flushAndMaybeDeleteEmpty();
  closeEditor();
});
document.getElementById('deleteBtn').addEventListener('click', deleteActive);
document.getElementById('nextMatch').addEventListener('click', function(){ gotoMatch(currentMatchPos + 1); });
document.getElementById('prevMatch').addEventListener('click', function(){ gotoMatch(currentMatchPos - 1); });
document.getElementById('textarea').addEventListener('input', scheduleSave);
document.getElementById('search').addEventListener('input', render);
document.getElementById('backupBtn').addEventListener('click', function(){
  var choice = confirm('Tap OK to export a backup file, or Cancel to import one instead.');
  if(choice) exportBackup(); else document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', function(e){
  if(e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('folderPicker').addEventListener('click', async function(e){
  var btn = e.target.closest('button');
  if(!btn) return;
  var folderVal = btn.getAttribute('data-folder') || null;
  if(!activeId) return;
  await updateDoc(doc(db, 'users', uid, 'notes', activeId), { folder: folderVal, updatedAt: Date.now() });
});

document.getElementById('tabs').addEventListener('click', async function(e){
  var btn = e.target.closest('.tab');
  if(!btn) return;
  var id = btn.getAttribute('data-tab');
  if((id === 'f1' || id === 'f2') && activeTab === id){
    var current = folders[id];
    var name = prompt('Rename folder', current);
    if(name && name.trim()){
      var updated = Object.assign({}, folders);
      updated[id] = name.trim();
      await setDoc(foldersDoc(), updated);
    }
  }
  activeTab = id;
  renderTabs(); render();
});

document.getElementById('list').addEventListener('click', async function(e){
  var delBtn = e.target.closest('.del');
  if(delBtn){
    e.stopPropagation();
    await deleteDoc(doc(db, 'users', uid, 'notes', delBtn.getAttribute('data-id')));
    return;
  }
  var card = e.target.closest('.note');
  if(card){ openEditor(card.getAttribute('data-id'), card.getAttribute('data-query') || ''); }
});

// ---------- Gemini chat ----------
var chatHistory = []; // {role: 'user'|'model', text: string}

function renderChat(){
  var wrap = document.getElementById('chatMessages');
  wrap.innerHTML = chatHistory.map(function(m){
    return '<div class="chatMsg ' + (m.role === 'user' ? 'user' : 'model') + '">' +
      '<div class="who">' + (m.role === 'user' ? 'You' : 'Gemini') + '</div>' +
      '<div class="bubble">' + escapeHtml(m.text) + '</div>' +
    '</div>';
  }).join('') || '<div class="chatMsg model"><div class="who">Gemini</div><div class="bubble">Hi — ask me anything.</div></div>';
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendChatMessage(){
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if(!text) return;
  chatHistory.push({role:'user', text: text});
  input.value = '';
  input.style.height = 'auto';
  renderChat();

  var sendBtn = document.getElementById('chatSendBtn');
  var typing = document.getElementById('chatTyping');

  var key = getGeminiKey();
  if(!key){
    chatHistory.push({role:'model', text: 'No Gemini key set for this browser yet — tap "Key" above to add one.'});
    renderChat();
    return;
  }

  sendBtn.disabled = true;
  typing.classList.remove('hidden');

  try{
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + key;
    var body = {
      contents: chatHistory.map(function(m){
        return { role: m.role, parts: [{ text: m.text }] };
      })
    };
    var response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var json = await response.json();
    if(!response.ok){
      throw new Error((json.error && json.error.message) || 'Request failed');
    }
    var reply = json.candidates && json.candidates[0] && json.candidates[0].content &&
                json.candidates[0].content.parts && json.candidates[0].content.parts[0] &&
                json.candidates[0].content.parts[0].text;
    chatHistory.push({role:'model', text: reply || "Sorry, I didn't get a response."});
  }catch(e){
    chatHistory.push({role:'model', text: 'Something went wrong reaching Gemini: ' + e.message});
  }

  sendBtn.disabled = false;
  typing.classList.add('hidden');
  renderChat();
}

document.getElementById('chatFabBtn').addEventListener('click', function(){
  document.getElementById('chatOverlay').classList.add('open');
  renderChat();
  setTimeout(function(){ document.getElementById('chatInput').focus(); }, 150);
});
document.getElementById('chatBackBtn').addEventListener('click', function(){
  document.getElementById('chatOverlay').classList.remove('open');
});
document.getElementById('chatKeyBtn').addEventListener('click', function(){
  var current = getGeminiKey();
  var entered = prompt('Paste your Gemini API key (stored only in this browser, never uploaded):', current);
  if(entered === null) return;
  entered = entered.trim();
  if(entered) localStorage.setItem('geminiApiKey', entered);
  else localStorage.removeItem('geminiApiKey');
  toast(entered ? 'Key saved to this browser' : 'Key cleared');
});
document.getElementById('chatClearBtn').addEventListener('click', function(){
  if(confirm('Clear this chat?')){ chatHistory = []; renderChat(); }
});
document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
document.getElementById('chatInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); }
});
document.getElementById('chatInput').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
